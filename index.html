         it; crossorigin matches THREE.ImageLoader's anonymous request so the
         preload actually hits cache. The aspect clause approximates the hero's
         own test (Globe.tsx): in a tall window the globe would reach the copy,
         so it is not drawn and these 686KB would be wasted. -->
    <link rel="preload" href="/earth-4k.webp" as="image" crossorigin media="(min-width: 721px) and (min-aspect-ratio: 5/4)" />
